name: Refresh and deploy Northstar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Northstar
        run: python -m pip install .
      - name: Build current dashboard snapshot
        shell: bash
        run: |
          northstar data sync --years 10
          northstar data snapshot > /tmp/northstar-dataset.json
          snapshot_id="$(jq -r '.snapshot_id' /tmp/northstar-dataset.json)"
          northstar export-site --provider snapshot --snapshot-id "$snapshot_id" --output site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
