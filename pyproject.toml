[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar"
version = "0.1.0"
description = "Explainable daily stock decision support"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "pandas>=2.2",
  "uvicorn[standard]>=0.35",
  "yfinance>=0.2.65",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.4", "ruff>=0.12"]

[project.scripts]
northstar = "northstar.cli:main"

[tool.setuptools.packages.find]
include = ["northstar*"]

[tool.setuptools.package-data]
northstar = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
